<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 120" width="500" height="120" fill="none">
  <defs>
    <linearGradient id="cue-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF6B35" />
      <stop offset="100%" stop-color="#E83E8C" />
    </linearGradient>
  </defs>

  <!-- Logo Mark Icon -->
  <g transform="translate(10, 10)">
    <!-- Outer Circle -->
    <circle cx="50" cy="50" r="46" fill="url(#cue-grad)" />
    <!-- Inner Plate Rim -->
    <circle cx="50" cy="50" r="38" fill="#18181B" stroke="#FFFFFF" stroke-width="2" opacity="0.9" />
    <!-- Chef Cloche Icon -->
    <path d="M50 24 C38 24 28 33 26 44 H74 C72 33 62 24 50 24 Z" fill="#FFFFFF" />
    <rect x="25" y="47" width="50" height="4" rx="2" fill="#FFFFFF" />
    <!-- Flame / Accent Dot -->
    <circle cx="50" cy="62" r="7" fill="url(#cue-grad)" />
  </g>

  <!-- Typography: CUE EATS -->
  <text x="120" y="65" font-family="'Instrument Sans', system-ui, -apple-system, sans-serif" font-weight="900" font-size="46" fill="#FFFFFF" letter-spacing="1">
    CUE <tspan fill="#FF6B35">EATS</tspan>
  </text>
  
  <!-- Subtitle -->
  <text x="123" y="90" font-family="'Instrument Sans', system-ui, -apple-system, sans-serif" font-weight="600" font-size="14" fill="#A1A1AA" letter-spacing="3">
    POS &amp; KITCHEN SYSTEM
  </text>
</svg>
